---
# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: ECE447 Course Webpage
author: DFEC
logo: logo.png
copyright: '2025'

# Execute notebooks at build time, but reuse the jupyter-cache when a notebook
# has not changed. Every figure on the Python exercise pages is generated by
# this step. See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: cache
  timeout: 300           # seconds per cell; the BER simulations need > default 30
  allow_errors: false    # a broken exercise should fail the build, not ship

# Sphinx builds every source file it finds, whether or not _toc.yml lists it.
# chapter*.ipynb used to be excluded here because the exercises did not execute
# cleanly; they do now and are listed in _toc.yml, so that entry is gone.
# NOTE: this list replaces jupyter-book's defaults rather than extending them,
# so the defaults are repeated. Add to it, never overwrite it.
exclude_patterns:
  - _build
  - Thumbs.db
  - .DS_Store
  - "**.ipynb_checkpoints"

# Buttons at the top of each notebook page: open it in Colab or Binder, or run
# the cells in place with Thebe.
launch_buttons:
  notebook_interface: jupyterlab
  binderhub_url: "https://mybinder.org"
  colab_url: "https://colab.research.google.com"
  thebe: true

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
# bibtex_bibfiles:
#  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/USAFA-ECE/ece447-book  # Online location of your book
  path_to_book: book  # Optional path to your book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  favicon: favicon.ico
  use_issues_button: true
  use_repository_button: true

# Uncomment to use mermaid diagrams
# sphinx:
  # extra_extensions:
    # - sphinxcontrib.mermaid
