---
# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: ECE447 Course Webpage
author: DFEC
logo: logo.png
copyright: '2025'

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force

# Sphinx builds every source file it finds, whether or not _toc.yml lists it.
# The L&D Python computer exercises (chapter*.ipynb) are not integrated yet and
# do not execute cleanly, so keep them out of the published build -- otherwise
# every deploy spends ~100 s running them and publishes their tracebacks under
# /reports/. Work on them on the python-exercises-interactive branch, which
# drops this entry; delete it here once they are ready to go live.
# NOTE: this list replaces jupyter-book's defaults, so they are repeated here.
exclude_patterns:
  - _build
  - Thumbs.db
  - .DS_Store
  - "**.ipynb_checkpoints"
  - chapter*.ipynb

# Add a "Launch on Google Colab" button to .ipynb files
launch_buttons:
  colab_url: "https://colab.research.google.com"

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
# bibtex_bibfiles:
#  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/USAFA-ECE/ece447-book  # Online location of your book
  path_to_book: book  # Optional path to your book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  favicon: favicon.ico
  use_issues_button: true
  use_repository_button: true

# Uncomment to use mermaid diagrams
# sphinx:
  # extra_extensions:
    # - sphinxcontrib.mermaid
