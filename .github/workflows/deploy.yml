---
name: GitHub Pages

# Only run this when the main branch changes
on:
  push:
    branches:
      - main
  pull_request: # allow for testing build artifacts before merge

# Required by actions/deploy-pages: id-token for the OIDC handshake with Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling one that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build the book and hand the HTML to the Pages artifact store
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 3.11+, so pip resolves the same scipy/matplotlib the exercises were
      # verified against. On 3.10 it caps at scipy 1.15 / matplotlib 3.10,
      # which nothing here has been executed on.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # pyldpc (chapter13) publishes no wheel, and its setup.py imports numpy
      # at build time. PEP 517 builds in an isolated env that has no numpy, so
      # a plain `pip install -r requirements.txt` fails resolving it. Install
      # the build deps first, then build against them. Pinning down to 0.7.6
      # (the last version with a wheel) is NOT an option -- its decoder is
      # broken on numpy 2.x.
      - name: Install dependencies
        run: |
          pip install numpy setuptools wheel
          pip install --no-build-isolation -r requirements.txt

      # The Python computer exercises are executed at build time. Reuse the
      # jupyter-cache between runs so only changed notebooks are re-executed.
      - name: Cache executed notebooks
        uses: actions/cache@v4
        with:
          path: book/_build/.jupyter_cache
          key: jupyter-cache-${{ hashFiles('book/*.ipynb', 'requirements.txt') }}
          restore-keys: jupyter-cache-

      # Build the book - adding more verboe detail
      - name: Build the book
        run: jupyter-book build book/

      # Browsable copy, for checking a PR build before merging it
      - name: Upload book as artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: book/_build/html/
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  # Publish to GitHub Pages.
  # Requires Settings -> Pages -> Build and deployment -> Source: GitHub Actions
  deploy:
    needs: build
    # Only publish if the main branch
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
