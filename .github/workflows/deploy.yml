---
name: GitHub Pages

# Only run this when the main branch changes
on:
  push:
    branches:
      - main
  pull_request: # allow for testing build artifacts before merge

# Required by actions/deploy-pages: id-token for the OIDC handshake with Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling one that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build the book and hand the HTML to the Pages artifact store
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Build the book - adding more verboe detail
      - name: Build the book
        run: jupyter-book build book/

      # Browsable copy, for checking a PR build before merging it
      - name: Upload book as artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: book/_build/html/
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  # Publish to GitHub Pages.
  # Requires Settings -> Pages -> Build and deployment -> Source: GitHub Actions
  deploy:
    needs: build
    # Only publish if the main branch
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
